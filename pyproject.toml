[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aideforge"
version = "1.0a1"
authors = [
  { name="Ferenc Vajda", email="ferenc.vajda@gmail.com" },
]
description = "An agent-based AI assistant framework with a CLI interface, extensible tools, and customizable commands."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "pydantic>=2.13.5",
    "transformers>=5.18.0",
]

[project.optional-dependencies]
# Some providers, more could be added
openai = [
    "langchain-openai>=1.6.7",
]
anthropic = [
    "langchain-anthropic>=1.7.5",
]
groq = [
    "langchain-groq>=1.1.3",
]
ollama = [
    "langchain-ollama>=1.1.0",
]

[project.urls]
"Homepage" = "https://github.com/fercsi/aideforge"
"Bug Tracker" = "https://github.com/fercsi/aideforge/issues"
